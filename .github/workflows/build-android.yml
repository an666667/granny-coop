name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build with GameCI
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          customImage: unityci/editor:ubuntu-2022.3.42f1-android-3
          buildName: granny-coop
          buildsPath: build
          buildMethod: GrannyCoop.EditorTools.CoopBuild.BuildAndroid
          manualExit: true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granny-coop-apk
          path: build/Android
          if-no-files-found: warn
