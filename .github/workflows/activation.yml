name: Get Unity activation file

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create manual activation file (.alf)
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD:/work" -w /work \
            unityci/editor:ubuntu-2020.2.0f1-android-3 \
            -c '
              set -x
              UNITY=$(find /opt/unity -type f -name Unity -perm -u+x 2>/dev/null | head -n 1)
              echo "Unity binary: $UNITY"
              if [ -z "$UNITY" ]; then echo "!! Unity binary not found"; exit 1; fi
              "$UNITY" -batchmode -nographics -logFile /dev/stdout \
                -createManualActivationFile -quit || true
              echo "--- workspace ---"
              ls -la /work
              echo "--- alf files ---"
              ls -la /work/*.alf || echo "no .alf produced"
            '

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: "*.alf"
          if-no-files-found: error
